services:
  api:
    build:
      context: .
      dockerfile: mlops/docker/Dockerfile.api
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./models:/app/models

  dashboard:
    build:
      context: .
      dockerfile: mlops/docker/Dockerfile.dashboard
    ports:
      - "8501:8501"
    depends_on:
      - api

  mlflow:
    build:
      context: .
      dockerfile: mlops/docker/Dockerfile.mlflow
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns:/mlflow/mlruns
